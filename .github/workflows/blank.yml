name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android platform folder safely
        run: |
          rm -rf /tmp/scaffold
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create --platforms=android --project-name english_adventure scaffold_app
          cd -
          rm -rf android
          cp -r /tmp/scaffold/scaffold_app/android .

      - name: Apply Android manifest overlay (TTS support)
        run: |
          if [ -f "build_support/android/AndroidManifest.xml" ]; then
            cp build_support/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: build/app/outputs/flutter-apk/app-release.apk
